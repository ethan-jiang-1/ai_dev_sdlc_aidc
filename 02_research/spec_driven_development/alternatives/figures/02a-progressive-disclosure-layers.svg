<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs><marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d6fb4"/></marker></defs>
  <text x="40" y="38" font-size="22" font-weight="700" fill="#222">渐进披露三层加载：token 预算是硬约束</text>
  <text x="40" y="62" font-size="13" fill="#777">Anthropic Skills 官方协议（工程博客 2025-10-16 + 平台文档，一手）· 观测 2026-09-21</text>

  <!-- Level boxes -->
  <rect x="60" y="100" width="300" height="120" rx="12" fill="#eaf3fc" stroke="#2d6fb4" stroke-width="2"/>
  <text x="210" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4f85">Level 1 · 元数据</text>
  <text x="210" y="152" font-size="12" text-anchor="middle" fill="#555">name + description</text>
  <text x="210" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#b05252">~100 tok / skill · 常驻系统提示词</text>
  <text x="210" y="192" font-size="11" text-anchor="middle" fill="#999">数百个 skills 的全部常驻成本</text>

  <rect x="430" y="100" width="300" height="120" rx="12" fill="#fff" stroke="#2d6fb4" stroke-width="2"/>
  <text x="580" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4f85">Level 2 · SKILL.md 正文</text>
  <text x="580" y="152" font-size="12" text-anchor="middle" fill="#555">操作手册 / 流程</text>
  <text x="580" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#b05252">&lt; 5k tok / &lt; 500 行</text>
  <text x="580" y="192" font-size="11" text-anchor="middle" fill="#999">按 description 匹配触发才加载</text>

  <rect x="800" y="100" width="300" height="120" rx="12" fill="#fff" stroke="#2d6fb4" stroke-width="2"/>
  <text x="950" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4f85">Level 3+ · 附属文件 / 脚本</text>
  <text x="950" y="152" font-size="12" text-anchor="middle" fill="#555">REFERENCE.md / FORMS / bins</text>
  <text x="950" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#2c6e4f">零 token 直到被读取</text>
  <text x="950" y="192" font-size="11" text-anchor="middle" fill="#999">脚本只回传输出，不占上下文</text>

  <line x1="360" y1="160" x2="430" y2="160" stroke="#2d6fb4" stroke-width="2" marker-end="url(#la)"/>
  <text x="395" y="148" font-size="11" fill="#2d6fb4" text-anchor="middle">触发</text>
  <line x1="730" y1="160" x2="800" y2="160" stroke="#2d6fb4" stroke-width="2" marker-end="url(#la)"/>
  <text x="765" y="148" font-size="11" fill="#2d6fb4" text-anchor="middle">按需</text>

  <!-- repo reality check table -->
  <text x="40" y="270" font-size="16" font-weight="700" fill="#222">理想 vs 实态：旗舰 repo 根文件实测（raw 2026-09-21）</text>
  <rect x="40" y="290" width="1080" height="240" rx="12" fill="#fafafa" stroke="#ddd"/>
  <g font-size="13">
    <line x1="40" y1="335" x2="1120" y2="335" stroke="#ccc"/>
    <text x="70" y="322" font-weight="700" fill="#333">repo</text>
    <text x="330" y="322" font-weight="700" fill="#333">行数 / 大小</text>
    <text x="600" y="322" font-weight="700" fill="#333">≈常驻 token</text>
    <text x="820" y="322" font-weight="700" fill="#333">特征</text>

    <text x="70" y="365" fill="#222">vercel/next.js</text>
    <text x="330" y="365" fill="#b05252" font-weight="700">524 行 / 29.3KB</text>
    <text x="600" y="365" fill="#b05252">≈7k（逼近 Codex 32KiB 截断线）</text>
    <text x="820" y="365" fill="#555">+ .agents/skills/ 池 + README 链路由</text>

    <text x="70" y="400" fill="#222">openai/codex</text>
    <text x="330" y="400">320 行 / 22.4KB</text>
    <text x="600" y="400">≈5k</text>
    <text x="820" y="400" fill="#555">单层深规则，无 skill 层</text>

    <text x="70" y="435" fill="#222">apache/airflow</text>
    <text x="330" y="435">246 行</text>
    <text x="600" y="435">≈4k</text>
    <text x="820" y="435" fill="#555">明文"不支持 skill 发现就读 SKILL.md"降级协议</text>

    <text x="70" y="470" fill="#222">anthropics/skills (pdf)</text>
    <text x="330" y="470">314 行 / 8.1KB</text>
    <text x="600" y="470" fill="#2c6e4f">≈2k（恰在 Level 2 预算内）</text>
    <text x="820" y="470" fill="#555">REFERENCE/FORMS/scripts 标准第三层</text>

    <text x="70" y="505" fill="#222">ghostty</text>
    <text x="330" y="505" fill="#2c6e4f" font-weight="700">39 行 / 1.4KB</text>
    <text x="600" y="505" fill="#2c6e4f">≈0.5k</text>
    <text x="820" y="505" fill="#555">唯一符合 "~100 行目录" 教条的样本</text>
  </g>

  <text x="40" y="570" font-size="13" fill="#444">判读："~100 行目录"是理想值而非实态——两个 OpenAI 系 / Apache 级 repo 根文件都在 5–7k tokens；描述不准致错加载、</text>
  <text x="40" y="590" font-size="13" fill="#444">地图过期（anthropics/skills 自身旧路径 404）、间接注入是四类官方一手自认的失效模式。</text>
</svg>
