  <text x="579" y="560" font-size="13" fill="#444" text-anchor="middle">收敛计数经 04a 证据档案复核勘误：初查 11 集群 → 独立 7 个（Trivedy=LangChain 同人合并、HumanLayer 改聚合型、学术为接力引用）</text>
  <text x="579" y="582" font-size="11" fill="#999" text-anchor="middle">工具化判读：整体处手艺阶段前夜——Codacy 模式（搭进既有质量平台）是唯一跑通的商业化路径，gardening agent 可复制不可售卖</text>
