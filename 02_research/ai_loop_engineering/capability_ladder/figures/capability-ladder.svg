<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1500" height="1100" fill="#f8fafc"/>
  <text x="70" y="68" font-size="34" font-weight="bold" fill="#172554">Loop Engineering：先学交接，再看前沿</text>
  <text x="70" y="105" font-size="18" fill="#475569">主线回答“谁执行、谁决定下一轮、谁决定何时再起跑”；两条支线可从有界任务进入，不是毕业要求。</text>
  <text x="85" y="156" font-size="20" font-weight="bold" fill="#1d4ed8">循序练习 · 交接面</text>
  <text x="985" y="156" font-size="20" font-weight="bold" fill="#7c3aed">可选探索 · 方向与场景</text>

  <rect x="70" y="180" width="800" height="142" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="220" font-size="25" font-weight="bold" fill="#334155">LE0 · 人逐次提示（起点）</text>
  <text x="95" y="255" font-size="18" fill="#334155">人选下一件事、逐次发起与检查结果。</text>
  <text x="95" y="289" font-size="16" fill="#64748b">一次请求中的 Agent 仍可能自行读写和调用工具；LE0 不是“无工具”。</text>

  <path d="M470 324 V351" stroke="#2563eb" stroke-width="3" fill="none"/>
  <polygon points="470,362 462,348 478,348" fill="#2563eb"/>
  <rect x="70" y="365" width="800" height="142" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="95" y="406" font-size="25" font-weight="bold" fill="#1e40af">LE1 · 有界执行</text>
  <text x="95" y="442" font-size="18" fill="#1e3a8a">把授权面内的工具动作交出去，不是把权限开到最大。</text>
  <text x="95" y="478" font-size="16" fill="#475569">人保留：动作/目标/时间边界、高风险审批、随时中断。</text>

  <path d="M470 508 V535" stroke="#2563eb" stroke-width="3" fill="none"/>
  <polygon points="470,546 462,532 478,532" fill="#2563eb"/>
  <rect x="70" y="549" width="800" height="142" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="95" y="590" font-size="25" font-weight="bold" fill="#1e40af">LE2 · 有界目标续跑</text>
  <text x="95" y="626" font-size="18" fill="#1e3a8a">由目标条件决定是否开下一轮、如何继续。</text>
  <text x="95" y="662" font-size="16" fill="#475569">人保留：目标、验收、预算；完成条件达成 ≠ 质量已验收。</text>

  <path d="M470 692 V719" stroke="#2563eb" stroke-width="3" fill="none"/>
  <polygon points="470,730 462,716 478,716" fill="#2563eb"/>
  <rect x="70" y="733" width="800" height="170" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="95" y="774" font-size="25" font-weight="bold" fill="#1e40af">LE3 · 按时 / 按事件唤醒</text>
  <text x="95" y="810" font-size="18" fill="#1e3a8a">把“什么时候再起跑”交给定时器或事件源。</text>
  <text x="95" y="844" font-size="16" fill="#475569">先区分会话内 /loop 与跨会话持久调度；后者风险更高。</text>
  <text x="95" y="875" font-size="16" fill="#475569">必须验证：状态、取消传播、上限、审批与人工接手。</text>

  <path d="M870 620 H915 V455 H943 M915 620 V765 H943" stroke="#a78bfa" stroke-width="3" fill="none" stroke-dasharray="10 7"/>
  <polygon points="950,455 937,447 937,463" fill="#a78bfa"/>
  <polygon points="950,765 937,757 937,773" fill="#a78bfa"/>
  <rect x="950" y="345" width="485" height="215" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="975" y="388" font-size="23" font-weight="bold" fill="#6d28d9">支线 A · 多主体编排</text>
  <text x="975" y="426" font-size="18" fill="#5b21b6">可并行研究或分工编码；不必先无人值守。</text>
  <text x="975" y="464" font-size="16" fill="#475569">拓扑未收敛：单线程写入 / 隔离写入合并</text>
  <text x="975" y="494" font-size="16" fill="#475569">另核任务可分性、所有权、预算与验收。</text>
  <text x="975" y="530" font-size="16" font-weight="bold" fill="#7c3aed">部分场景已落地 · 非人人必修</text>

  <rect x="950" y="652" width="485" height="227" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="975" y="694" font-size="23" font-weight="bold" fill="#6d28d9">支线 B · 改进循环本身</text>
  <text x="975" y="732" font-size="18" fill="#5b21b6">人改 → 代理提案 → 外围件受控应用</text>
  <text x="975" y="767" font-size="16" fill="#475569">工具描述改写有局部案例；自动改核心判据</text>
  <text x="975" y="797" font-size="16" fill="#475569">仍是高风险方向，不从局部案例外推。</text>
  <text x="975" y="837" font-size="16" font-weight="bold" fill="#7c3aed">展示趋势 · 不要求学员掌握</text>

  <rect x="70" y="952" width="1365" height="100" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="93" y="988" font-size="19" font-weight="bold" fill="#9a3412">结果可信闭环</text>
  <text x="230" y="988" font-size="18" fill="#7c2d12">目标 → 证据 → 裁决 → 停机/交接 → 后验复核；缺少业务结果观察时不宣告完成。</text>
  <text x="93" y="1026" font-size="15" fill="#64748b">证据和边界：capability_ladder/00-map.md ｜ 观测 2026-09-30 ｜ 本图是教学路径，不是行业成熟度标准。</text>
</svg>
