<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e3a8a"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
    <style>
      .title{font-size:32px;font-weight:700;fill:#102a43}.sub{font-size:18px;fill:#334e68}.label{font-size:16px;font-weight:700;fill:#486581}.cardTitle{font-size:20px;font-weight:700}.body{font-size:17px;fill:#243b53}.small{font-size:16px;fill:#486581}.note{font-size:17px;fill:#243b53}.footer{font-size:16px;fill:#52606d}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7fafc"/>
  <text x="50" y="50" class="title">R2 · 有界目标续跑：条件判停，不替代质量验收</text>
  <text x="50" y="82" class="sub">人给目标、检查方式和预算；外层检查器决定继续 / 停止 / 升级，真实产出仍由人或独立验收者把关。</text>

  <rect x="50" y="112" width="820" height="480" rx="14" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
  <text x="75" y="145" class="label">一轮控制链 · 输入 → 执行 → 反馈 → 三值决策 → 停止或下一轮</text>

  <rect x="78" y="178" width="215" height="132" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="98" y="207" class="cardTitle" fill="#075985">输入 · 人保留</text>
  <text x="98" y="235" class="body">goal：可观察终态</text>
  <text x="98" y="262" class="small">检查方式 + 不变约束</text>
  <text x="98" y="288" class="small">轮 / 时间 / 成本预算</text>
  <path d="M293 244 H333" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="333" y="178" width="210" height="132" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="353" y="207" class="cardTitle" fill="#166534">动作 · 有界迭代</text>
  <text x="353" y="235" class="body">按 R1 授权执行</text>
  <text x="353" y="262" class="small">工具动作 / 修复 / 测试</text>
  <text x="353" y="288" class="small">产出证据与副作用</text>
  <path d="M543 244 H584" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="584" y="178" width="236" height="132" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="604" y="207" class="cardTitle" fill="#92400e">反馈 · 外层检查器</text>
  <text x="604" y="235" class="body">读可见证据 / 约定指标</text>
  <text x="604" y="262" class="small">输出 verdict + 下一步反馈</text>
  <text x="604" y="288" class="small">独立于执行者更可靠</text>
  <path d="M702 310 V348" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="230" y="348" width="590" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="253" y="379" class="cardTitle" fill="#1e40af">决策 · 三值条件（示例源：Claude Code /goal）</text>
  <text x="253" y="408" class="body">Not yet met（未达成） · Met（达成） · Impossible（不可能）</text>

  <path d="M370 434 V478 H330 V514" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="257" y="470" class="small" fill="#166534">Not yet met：带反馈再跑</text>
  <rect x="230" y="514" width="190" height="54" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="252" y="548" class="cardTitle" fill="#166534">动作：开下一轮</text>

  <path d="M525 434 V478 H515 V514" stroke="#b91c1c" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="445" y="470" class="small" fill="#991b1b">Met：条件停止</text>
  <rect x="420" y="514" width="190" height="54" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="447" y="548" class="cardTitle" fill="#991b1b">停止：交人工验收</text>

  <path d="M680 434 V478 H700 V514" stroke="#b91c1c" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <text x="626" y="470" class="small" fill="#991b1b">Impossible：停并升级</text>
  <rect x="610" y="514" width="210" height="54" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="632" y="548" class="cardTitle" fill="#991b1b">停止：人改目标 / 接手</text>

  <rect x="78" y="348" width="125" height="220" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="96" y="378" class="cardTitle" fill="#115e59">人保留</text>
  <text x="96" y="412" class="small">目标措辞</text>
  <text x="96" y="440" class="small">真实验收</text>
  <text x="96" y="468" class="small">预算上限</text>
  <text x="96" y="496" class="small">随时中断</text>
  <text x="96" y="524" class="small">回滚接手</text>

  <rect x="900" y="112" width="330" height="480" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="924" y="148" class="cardTitle" fill="#9a3412">工程注意 / 常见故障</text>
  <text x="924" y="186" class="note">• 三值判停只是条件裁决：</text>
  <text x="942" y="212" class="note">  Met ≠ 真实业务质量验收。</text>
  <text x="924" y="252" class="note">• 测试退出码 0 只说明该命令</text>
  <text x="942" y="278" class="note">  成功，不说明需求无回归。</text>
  <text x="924" y="318" class="note">• 进度条“全通过”需追到</text>
  <text x="942" y="344" class="note">  驱动层 break/return；别只看展示。</text>
  <text x="924" y="384" class="note">• 无进展、时间 / 成本到顶也要</text>
  <text x="942" y="410" class="note">  停并升级，不冒充完成。</text>
  <text x="924" y="450" class="note">• Claude /goal 的三值与 Managed</text>
  <text x="942" y="476" class="note">  Agents outcome/grader 不是同一 API。</text>
  <line x1="924" y1="500" x2="1206" y2="500" stroke="#fdba74" stroke-width="2"/>
  <text x="924" y="532" class="label">边界</text>
  <text x="924" y="558" class="note">条件可核、反馈够用、验收仍独立；</text>
  <text x="924" y="584" class="note">不要把跨产品参数抄成默认值。</text>

  <text x="50" y="622" class="footer">来源短标：rung-02-goal-driven.md；evidence-b §4a；evidence-l quickstart 源码；evidence-w W5/W6。</text>
  <text x="50" y="650" class="footer">教学抽象 / 示例非同一产品；三值示例来自 Claude Code /goal，Managed Agents 的 rubric/grader 另行理解。</text>
</svg>
