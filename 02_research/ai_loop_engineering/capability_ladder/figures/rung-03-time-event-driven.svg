<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e3a8a"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
    <style>
      .title{font-size:32px;font-weight:700;fill:#102a43}.sub{font-size:18px;fill:#334e68}.label{font-size:16px;font-weight:700;fill:#486581}.cardTitle{font-size:20px;font-weight:700}.body{font-size:17px;fill:#243b53}.small{font-size:16px;fill:#486581}.note{font-size:17px;fill:#243b53}.footer{font-size:16px;fill:#52606d}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7fafc"/>
  <text x="50" y="50" class="title">LE3 · 按时 / 按事件唤醒：交出 when，不等于交出 what</text>
  <text x="50" y="82" class="sub">先教 session-scoped 的本地 /loop，再单列 cloud scheduled 的持久任务；两者都必须能取消、限额、接手。</text>

  <rect x="50" y="112" width="820" height="480" rx="14" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
  <text x="75" y="145" class="label">正交控制轴：what（LE1 授权 + LE2 目标） × when（时间 / 事件触发）</text>

  <rect x="78" y="175" width="164" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="98" y="205" class="cardTitle" fill="#1e40af">what · 人定</text>
  <text x="98" y="233" class="small">动作、目标、预算</text>
  <path d="M242 215 H278" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="278" y="175" width="180" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="298" y="205" class="cardTitle" fill="#075985">输入状态</text>
  <text x="298" y="233" class="small">目标、进度、授权范围</text>
  <path d="M458 215 H498" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="498" y="175" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="518" y="205" class="cardTitle" fill="#92400e">when · 触发器</text>
  <text x="518" y="233" class="small">定时 / 事件</text>
  <path d="M668 215 H710" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="710" y="175" width="140" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="731" y="205" class="cardTitle" fill="#166534">受控运行</text>
  <text x="731" y="233" class="small">执行一次</text>

  <text x="78" y="296" class="label">A · 会话内定时 /loop（session-scoped）</text>
  <rect x="78" y="312" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="98" y="342" class="cardTitle" fill="#92400e">输入</text>
  <text x="98" y="370" class="small">“每 5 分钟检查”</text>
  <path d="M248 352 H284" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="284" y="312" width="174" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="304" y="342" class="cardTitle" fill="#075985">决策</text>
  <text x="304" y="370" class="small">会话在？续排？</text>
  <path d="M458 352 H494" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="494" y="312" width="174" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="514" y="342" class="cardTitle" fill="#166534">动作</text>
  <text x="514" y="370" class="small">运行并写回结果</text>
  <path d="M668 352 H704" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="704" y="312" width="146" height="80" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="724" y="342" class="cardTitle" fill="#115e59">反馈 / 停止</text>
  <text x="724" y="370" class="small">重排或 stop</text>

  <text x="78" y="426" class="label">B · 云端调度（cloud scheduled · persistent）</text>
  <rect x="78" y="442" width="156" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="96" y="471" class="cardTitle" fill="#92400e">输入</text>
  <text x="96" y="498" class="small">cron / webhook</text>
  <text x="96" y="521" class="small">初始任务</text>
  <path d="M234 488 H268" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="268" y="442" width="166" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="288" y="471" class="cardTitle" fill="#075985">决策</text>
  <text x="288" y="498" class="small">部署 active？</text>
  <text x="288" y="521" class="small">状态能否重读？</text>
  <path d="M434 488 H468" stroke="#1e3a8a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="468" y="442" width="166" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="488" y="471" class="cardTitle" fill="#166534">动作</text>
  <text x="488" y="498" class="small">新 session / worker</text>
  <text x="488" y="521" class="small">运行、写回状态</text>
  <path d="M634 488 H668" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="668" y="442" width="182" height="92" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="688" y="471" class="cardTitle" fill="#115e59">反馈 / 停止</text>
  <text x="688" y="498" class="small">结果、错误、计划</text>
  <text x="688" y="521" class="small">取消传播到两端</text>

  <text x="456" y="572" class="small" fill="#991b1b">停止检查：不再派发 + worker 已退出</text>
  <rect x="78" y="552" width="360" height="28" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1"/>
  <text x="92" y="572" class="small" fill="#115e59">人保留：范围 / 预算 / 取消 / 接手</text>

  <rect x="900" y="112" width="330" height="480" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="924" y="148" class="cardTitle" fill="#9a3412">工程注意 / 常见故障</text>
  <text x="924" y="186" class="note">• 本地 /loop 随会话结束而停；</text>
  <text x="942" y="212" class="note">  不要画成跨会话持久任务。</text>
  <text x="924" y="252" class="note">• Managed Agents 调度要初始</text>
  <text x="942" y="278" class="note">  event；跨次接续才需另存状态。</text>
  <text x="924" y="318" class="note">• 取消必须传播：调度器停止</text>
  <text x="942" y="344" class="note">  派发，既有 worker 也要退出。</text>
  <text x="924" y="384" class="note">• scheduler 只回答 when；动作</text>
  <text x="942" y="410" class="note">  what 仍由 LE1 授权门控制。</text>
  <text x="924" y="450" class="note">• 定时器存在不等于质量完成；</text>
  <text x="942" y="476" class="note">  LE2 判停与人工验收仍独立。</text>
  <line x1="924" y1="500" x2="1206" y2="500" stroke="#fdba74" stroke-width="2"/>
  <text x="924" y="532" class="label">停止检查</text>
  <text x="924" y="558" class="note">状态、取消、硬上限、审批、</text>
  <text x="924" y="584" class="note">升级路径都要可观察。</text>

  <text x="50" y="622" class="footer">来源短标：rung-03-time-event-driven.md；evidence-b §4c；evidence-w W2/W7；evidence-e §2B。</text>
  <text x="50" y="650" class="footer">教学抽象 / 示例非同一产品；Claude Code /loop、Cursor Automations、Managed Agents 的运行边界与参数不可互抄。</text>
</svg>
