<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1500" height="1000" fill="#f8fafc"/>
  <text x="60" y="62" font-size="33" font-weight="bold" fill="#172554">证据地图：存在、可用与成熟不是同一件事</text>
  <text x="60" y="100" font-size="18" fill="#475569">不再数“六源命中率”：功能类型、运行模式、传播转述不能作为同一种独立票相加。</text>

  <rect x="60" y="132" width="1380" height="61" rx="12" fill="#1e293b"/>
  <text x="86" y="171" font-size="18" font-weight="bold" fill="#fff">交接面</text>
  <text x="370" y="171" font-size="18" font-weight="bold" fill="#fff">一手锚点</text>
  <text x="830" y="171" font-size="18" font-weight="bold" fill="#fff">能证明什么</text>
  <text x="1155" y="171" font-size="18" font-weight="bold" fill="#fff">不能推出什么</text>

  <rect x="60" y="204" width="1380" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="86" y="248" font-size="22" font-weight="bold" fill="#1e40af">R1 有界执行</text>
  <text x="86" y="283" font-size="16" fill="#475569">单次运行 · 主线</text>
  <text x="370" y="245" font-size="17" fill="#334155">Cursor 审批面</text>
  <text x="370" y="279" font-size="17" fill="#334155">Claude Code auto mode / Codex</text>
  <text x="830" y="246" font-size="17" fill="#334155">动作可分级处置：</text>
  <text x="830" y="279" font-size="17" fill="#334155">放行、沙箱、拒绝或升级</text>
  <text x="1155" y="245" font-size="16" fill="#475569">仅有授权面就能保证</text>
  <text x="1155" y="278" font-size="16" fill="#475569">产出质量与安全</text>

  <rect x="60" y="341" width="1380" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="86" y="386" font-size="22" font-weight="bold" fill="#1e40af">R2 有界续跑</text>
  <text x="86" y="422" font-size="16" fill="#475569">按目标条件 · 主线</text>
  <text x="370" y="384" font-size="17" fill="#334155">Claude Code /goal</text>
  <text x="370" y="418" font-size="17" fill="#334155">Osmani 实践；quickstart 反例</text>
  <text x="830" y="384" font-size="17" fill="#334155">有继续/完成/不可能出口</text>
  <text x="830" y="418" font-size="17" fill="#334155">与机器可核任务实例</text>
  <text x="1155" y="384" font-size="16" fill="#475569">检查通过等于真实质量；</text>
  <text x="1155" y="418" font-size="16" fill="#475569">所有驱动都会自动判停</text>

  <rect x="60" y="478" width="1380" height="126" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="86" y="524" font-size="22" font-weight="bold" fill="#1e40af">R3 定时唤醒</text>
  <text x="86" y="560" font-size="16" fill="#475569">会话内 / 跨会话 · 主线</text>
  <text x="370" y="522" font-size="17" fill="#334155">Claude Code /loop 与云调度</text>
  <text x="370" y="556" font-size="17" fill="#334155">Cursor /loop；Runkle event-driven</text>
  <text x="830" y="522" font-size="17" fill="#334155">不同的时间、结果、事件</text>
  <text x="830" y="556" font-size="17" fill="#334155">触发方式确实存在</text>
  <text x="1155" y="522" font-size="16" fill="#475569">/loop 必然跨会话；</text>
  <text x="1155" y="556" font-size="16" fill="#475569">持久运行已通用成熟</text>

  <rect x="60" y="615" width="1380" height="126" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="86" y="660" font-size="22" font-weight="bold" fill="#6d28d9">支线 A · 编排</text>
  <text x="86" y="696" font-size="16" fill="#475569">部分场景落地 · 非必修</text>
  <text x="370" y="660" font-size="17" fill="#334155">Anthropic 研究编排器</text>
  <text x="370" y="694" font-size="17" fill="#334155">Cognition / Carlini 不同写拓扑</text>
  <text x="830" y="660" font-size="17" fill="#334155">可分工与并行；须控制</text>
  <text x="830" y="694" font-size="17" fill="#334155">所有权、冲突及整树预算</text>
  <text x="1155" y="660" font-size="16" fill="#475569">写入单线程为三家共识；</text>
  <text x="1155" y="694" font-size="16" fill="#475569">必须先掌握 R3</text>

  <rect x="60" y="752" width="1380" height="126" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="86" y="797" font-size="22" font-weight="bold" fill="#6d28d9">支线 B · 自改</text>
  <text x="86" y="833" font-size="16" fill="#475569">局部实例 · 前沿方向</text>
  <text x="370" y="797" font-size="17" fill="#334155">Runkle / Morris 概念</text>
  <text x="370" y="831" font-size="17" fill="#334155">Anthropic 工具描述改写案例</text>
  <text x="830" y="797" font-size="17" fill="#334155">外围件可受控试验；</text>
  <text x="830" y="831" font-size="17" fill="#334155">人改与代理改须分开</text>
  <text x="1155" y="797" font-size="16" fill="#475569">核心判据自动改写</text>
  <text x="1155" y="831" font-size="16" fill="#475569">已有通用安全放行阈值</text>

  <text x="70" y="933" font-size="17" font-weight="bold" fill="#9a3412">成熟度红线：</text>
  <text x="215" y="933" font-size="17" fill="#7c2d12">R3 跨会话、编排写入与核心自改尤其依赖场景与护栏；有案例 ≠ 已普及 ≠ 已证净收益。</text>
  <text x="70" y="973" font-size="15" fill="#64748b">判定与逐项证据：capability_ladder/00-map.md ｜ 观测 2026-09-30 ｜ arXiv:2608.21884 的来源承袭与样本可见性限制须并列讲。</text>
</svg>
