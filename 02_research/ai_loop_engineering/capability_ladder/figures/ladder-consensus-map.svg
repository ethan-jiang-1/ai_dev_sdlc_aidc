  <!-- dissent band -->
  <rect x="60" y="784" width="1440" height="250" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="80" y="816" font-size="18" font-weight="bold" fill="#c53030">分歧带——总趋势一致，争论在坡度（每阶一条，教学时必须并列给出）</text>
  <text x="80" y="848" font-size="15" fill="#742a2a">R1 ｜ "93% 的权限提示被顺手放行……以提示结束的规则不是规则"（marmelab 引 arXiv 2608.27443：预写规则比逐条批准少拦 20.1pp 坏动作）</text>
  <text x="80" y="878" font-size="15" fill="#742a2a">R2 ｜ "对 AI 生成的测试寄予太多信任，这还不够好"（Böckeler）＋ 自反思在故障下放大失败 ∂R/∂λ=−0.50（ReliabilityBench）</text>
  <text x="80" y="908" font-size="15" fill="#742a2a">R3 ｜ "无人值守的循环，也是无人看守地犯错" ＋ "done 是声明不是证明"（Osmani）＋ zombie 循环穿透显式关闭（issue #46787）</text>
  <text x="80" y="938" font-size="15" fill="#742a2a">R4 ｜ "单代理 vs 多代理至今是 open question"（Anthropic 2025-11）＋ 审批代理可被红队误导（OpenAI 自警）＋ swarm 是 distraction（Walden）</text>
  <text x="80" y="968" font-size="15" fill="#742a2a">R5 ｜ "判据可见时被绕过率高 43×"（METR）＋ Goodhart 定律 ＋ "模型升级会抹掉 scaffolding 收益"（Cherny：never bet against the model）</text>
  <text x="80" y="1004" font-size="16" font-weight="bold" fill="#c53030">总趋势：所有分歧针对升阶速度与适用域，无一否认阶序本身——"从授权执行到目标驱动到触发外移"无反向案例。</text>

  <text x="60" y="1074" font-size="13" fill="#718096">● 显式落位 ｜ ◐ 语义或构件覆盖 ｜ ○ 缺位或不适用 ｜ ✗ 被跳过（红） ｜ 候选阶已于 2026-09-30 全部升格，详见 00-map.md §三判读与 evidence-u</text>
