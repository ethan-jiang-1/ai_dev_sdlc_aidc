<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650">
  <defs>
    <style>
      text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
      .subtitle { font-size: 13px; fill: #666; text-anchor: middle; }
      .box-title { font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .box-desc { font-size: 12px; fill: rgba(255,255,255,0.85); text-anchor: middle; }
      .arrow-label { font-size: 12px; fill: #555; text-anchor: middle; }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#1976d2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#43a047"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#e53935"/>
    </marker>
  </defs>

  <text x="400" y="35" class="title">Loop 1 · Agentic 编码循环</text>
  <text x="400" y="58" class="subtitle">AI 自己写、自己测、自己改 — 人类在这个环里不需要出手</text>

  <!-- Input box -->
  <rect x="50" y="90" width="200" height="80" rx="10" fill="#1565c0"/>
  <text x="150" y="122" class="box-title">📋 输入</text>
  <text x="150" y="145" class="box-desc">产品规格说明 (Spec)</text>
  <text x="150" y="162" class="box-desc">Evals 测试集 (可选)</text>

  <!-- Arrow: Input → Write Code -->
  <line x1="250" y1="130" x2="390" y2="130" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Write Code -->
  <rect x="400" y="90" width="180" height="80" rx="10" fill="#1976d2"/>
  <text x="490" y="122" class="box-title">✍️ AI 写代码</text>
  <text x="490" y="145" class="box-desc">生成实现</text>
  <text x="490" y="162" class="box-desc">构建新版本</text>

  <!-- Arrow: Write → Test -->
  <line x1="490" y1="170" x2="490" y2="230" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Test -->
  <rect x="400" y="240" width="180" height="80" rx="10" fill="#43a047"/>
  <text x="490" y="272" class="box-title">🧪 AI 自测</text>
  <text x="490" y="295" class="box-desc">运行测试</text>
  <text x="490" y="312" class="box-desc">浏览器检查结果</text>

  <!-- Arrow: Test → Check decision -->
  <line x1="490" y1="320" x2="490" y2="380" stroke="#43a047" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Decision diamond -->
  <polygon points="490,390 570,445 490,500 410,445" fill="#fff" stroke="#ff9800" stroke-width="2"/>
  <text x="490" y="440" class="arrow-label" fill="#e65100" font-weight="700">通过?</text>

  <!-- No path → Fix -->
  <line x1="410" y1="445" x2="200" y2="445" stroke="#e53935" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="310" y="435" class="arrow-label" fill="#e53935">❌ 不通过</text>

  <!-- Fix -->
  <rect x="50" y="405" width="150" height="80" rx="10" fill="#e53935"/>
  <text x="125" y="437" class="box-title">🔧 AI 修复</text>
  <text x="125" y="460" class="box-desc">分析失败原因</text>
  <text x="125" y="477" class="box-desc">修改代码</text>

  <!-- Arrow: Fix → back to Write -->
  <line x1="125" y1="405" x2="125" y2="170" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="125" y1="170" x2="390" y2="170" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="200" y="163" class="arrow-label" fill="#e53935" font-size="11">重新生成</text>

  <!-- Yes path → Output -->
  <line x1="570" y1="445" x2="700" y2="445" stroke="#43a047" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="640" y="435" class="arrow-label" fill="#43a047" font-weight="700">✅ 通过</text>

  <!-- Output -->
  <rect x="650" y="405" width="130" height="80" rx="10" fill="#2e7d32"/>
  <text x="715" y="437" class="box-title">📦 产出</text>
  <text x="715" y="460" class="box-desc">可交付代码</text>
  <text x="715" y="477" class="box-desc">→ 交给开发者审查</text>

  <!-- Key insight box -->
  <rect x="80" y="530" width="640" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="400" y="555" font-size="15" font-weight="700" fill="#1565c0" text-anchor="middle">💡 关键变化</text>
  <text x="400" y="578" font-size="13" fill="#333" text-anchor="middle">去年：人类当 QA → 手动找 bug → 告诉 AI 修</text>
  <text x="400" y="598" font-size="13" fill="#333" text-anchor="middle">现在：AI 自己测、自己修 → 人类被解放做更高层决策</text>
</svg>
